<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Spendie"/>
<meta name="theme-color" content="#F8FAFC"/>
<title>Spendie</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --mint: #7EE081;
  --aqua: #31C6E3;
  --grad: linear-gradient(135deg, #7EE081, #31C6E3);
  --grad-soft: linear-gradient(135deg, rgba(126,224,129,.15), rgba(49,198,227,.15));
  --navy: #0B1B3A;
  --bg: #F8FAFC;
  --bg2: #EEF2F7;
  --card: #FFFFFF;
  --text: #0B1B3A;
  --text2: #64748B;
  --text3: #94A3B8;
  --border: #E2E8F0;
  --red: #FF6B6B;
  --green: #34D399;
  --yellow: #FACC15;
  --shadow: 0 4px 24px rgba(11,27,58,.08);
  --shadow-sm: 0 2px 8px rgba(11,27,58,.06);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}
[data-theme="dark"] {
  --bg: #0F172A;
  --bg2: #1E293B;
  --card: #1E293B;
  --text: #F8FAFC;
  --text2: #94A3B8;
  --text3: #64748B;
  --border: #334155;
  --shadow: 0 4px 24px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;}
body{padding-bottom:90px;overflow-x:hidden;}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--grad);border-radius:2px;}

/* HEADER */
#header{background:var(--bg);padding:52px 20px 0;position:sticky;top:0;z-index:100;transition:background .3s;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.app-name{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg2);color:var(--text);transition:all .2s;}
.icon-btn:active{transform:scale(.92);}

/* BALANCE HERO */
.balance-hero{background:var(--grad);border-radius:var(--radius);padding:24px 22px;margin:0 0 6px;position:relative;overflow:hidden;}
.balance-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:rgba(255,255,255,.1);border-radius:50%;}
.balance-hero::after{content:'';position:absolute;bottom:-50px;left:20px;width:100px;height:100px;background:rgba(255,255,255,.07);border-radius:50%;}
.balance-tag{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px;}
.balance-amount{font-family:'Poppins',sans-serif;font-size:40px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:4px;}
.balance-tagline{font-size:12px;color:rgba(255,255,255,.7);}
.balance-chips{display:flex;gap:10px;margin-top:16px;}
.b-chip{background:rgba(255,255,255,.18);border-radius:30px;padding:6px 14px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px);}
.b-chip-icon{font-size:13px;}
.b-chip-val{font-size:13px;font-weight:600;color:#fff;}
.b-chip-lbl{font-size:10px;color:rgba(255,255,255,.7);}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;}
.stat-label{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.stat-value{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:var(--text);}
.stat-count{font-size:11px;color:var(--text3);margin-top:2px;}

/* SECTION TITLES */
.sec-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin:20px 0 12px;}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;}
.sec-link{font-size:13px;color:var(--aqua);font-weight:600;background:none;border:none;cursor:pointer;}

/* SPEND BAR CARD */
.spend-card{background:var(--card);border-radius:var(--radius-sm);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.spend-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.spend-lbl{font-size:13px;color:var(--text2);font-weight:500;}
.spend-pct-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.spend-track{background:var(--bg2);border-radius:6px;height:8px;overflow:hidden;}
.spend-fill{height:100%;border-radius:6px;background:var(--grad);transition:width .6s ease;}
.spend-fill.danger{background:linear-gradient(90deg,#FACC15,#FF6B6B);}
.spend-sub{font-size:12px;color:var(--text3);margin-top:8px;}

/* CATEGORY BREAKDOWN */
.cat-card{background:var(--card);border-radius:var(--radius-sm);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.cat-item{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cat-item:last-child{margin-bottom:0;}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cat-item-name{font-size:13px;color:var(--text);font-weight:500;flex:1;}
.cat-item-bar-wrap{flex:2;background:var(--bg2);border-radius:4px;height:6px;overflow:hidden;}
.cat-item-bar{height:100%;border-radius:4px;opacity:.85;}
.cat-item-amt{font-size:13px;font-weight:600;color:var(--text);flex-shrink:0;min-width:60px;text-align:right;}

/* RECENT TRANSACTIONS */
.txn-card{background:var(--card);border-radius:var(--radius-sm);padding:4px 0;box-shadow:var(--shadow-sm);border:1px solid var(--border);overflow:hidden;}
.txn-row{display:flex;align-items:center;gap:12px;padding:13px 16px;transition:background .15s;}
.txn-row:active{background:var(--bg2);}
.txn-icon-wrap{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.txn-info{flex:1;min-width:0;}
.txn-label{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.txn-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.txn-amt{font-size:15px;font-weight:700;flex-shrink:0;}
.txn-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:4px 6px;line-height:1;flex-shrink:0;transition:color .2s;}
.txn-del:active{color:var(--red);}
.txn-divider{height:1px;background:var(--border);margin:0 16px;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:50px 30px;}
.empty-emoji{font-size:56px;margin-bottom:16px;}
.empty-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--text2);line-height:1.6;}
.empty-cta{margin-top:20px;background:var(--grad);color:#fff;border:none;border-radius:30px;padding:12px 28px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}

/* STREAK CARD */
.streak-card{background:var(--grad-soft);border:1.5px solid rgba(126,224,129,.3);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;}
.streak-icon{font-size:32px;}
.streak-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.streak-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.streak-badge{margin-left:auto;background:var(--grad);color:#fff;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;white-space:nowrap;}

/* FAB */
#fab{position:fixed;bottom:100px;right:20px;width:58px;height:58px;border-radius:50%;background:var(--grad);border:none;cursor:pointer;font-size:28px;color:#fff;box-shadow:0 6px 20px rgba(49,198,227,.4);display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .2s,box-shadow .2s;}
#fab:active{transform:scale(.93);box-shadow:0 3px 10px rgba(49,198,227,.3);}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.06);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 4px;transition:all .2s;}
.nav-icon{font-size:20px;transition:transform .2s;}
.nav-label{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.03em;transition:color .2s;}
.nav-btn.active .nav-icon{transform:scale(1.15);}
.nav-btn.active .nav-label{color:var(--aqua);font-weight:700;}

/* ADD SHEET (bottom sheet) */
#add-sheet{position:fixed;inset:0;z-index:200;display:none;}
#add-sheet.open{display:block;}
.sheet-overlay{position:absolute;inset:0;background:rgba(11,27,58,.4);backdrop-filter:blur(2px);}
.sheet-body{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px env(safe-area-inset-bottom,28px);max-height:92vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.sheet-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:20px;text-align:center;}

/* TYPE TOGGLE */
.type-toggle{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:20px;}
.type-btn{flex:1;padding:10px;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;transition:all .25s;color:var(--text2);}
.type-btn.income-active{background:#fff;color:var(--green);box-shadow:var(--shadow-sm);}
.type-btn.expense-active{background:#fff;color:var(--red);box-shadow:var(--shadow-sm);}
[data-theme="dark"] .type-btn.income-active,[data-theme="dark"] .type-btn.expense-active{background:var(--bg);}

/* CATEGORY PICKER */
.cat-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.cat-pick-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:2px solid var(--border);border-radius:14px;background:var(--bg2);cursor:pointer;transition:all .2s;}
.cat-pick-btn.selected{border-color:var(--aqua);background:rgba(49,198,227,.1);}
.cat-pick-btn:active{transform:scale(.95);}
.cat-pick-icon{font-size:22px;}
.cat-pick-lbl{font-size:10px;color:var(--text2);font-weight:500;text-align:center;}
.cat-pick-btn.selected .cat-pick-lbl{color:var(--aqua);font-weight:700;}

/* FORM FIELDS */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
.field input,.field select{width:100%;background:var(--bg2);border:2px solid transparent;border-radius:14px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;font-weight:500;transition:border-color .2s;-webkit-appearance:none;}
.field input:focus,.field select:focus{outline:none;border-color:var(--aqua);}
.field input::placeholder{color:var(--text3);}
.amount-wrap{position:relative;}
.amount-wrap .currency{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--text2);}
.amount-wrap input{padding-left:34px;font-size:24px;font-family:'Poppins',sans-serif;font-weight:700;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.submit-btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:16px;padding:16px;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .2s;letter-spacing:.02em;}
.submit-btn:active{opacity:.9;transform:scale(.98);}

/* EXPORT MODAL */
#export-modal{position:fixed;inset:0;z-index:200;display:none;}
#export-modal.open{display:block;}
.exp-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px env(safe-area-inset-bottom,28px);animation:slideUp .3s ease;}
.exp-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;}
.exp-sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.exp-opt{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border-radius:16px;margin-bottom:10px;border:none;cursor:pointer;width:100%;text-align:left;transition:opacity .2s;}
.exp-opt:active{opacity:.7;}
.exp-opt-icon{font-size:28px;flex-shrink:0;}
.exp-opt-title{font-size:14px;font-weight:700;color:var(--text);display:block;}
.exp-opt-sub{font-size:11px;color:var(--text2);margin-top:2px;display:block;line-height:1.4;}
.exp-cancel{width:100%;background:var(--bg2);border:none;border-radius:14px;padding:15px;font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;color:var(--text2);cursor:pointer;margin-top:4px;}

/* TOAST */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:300;white-space:nowrap;animation:toastIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.2);}
[data-theme="dark"] .toast{background:var(--card);color:var(--text);border:1px solid var(--border);}
@keyframes toastIn{from{opacity:0;top:40px;}to{opacity:1;top:60px;}}

/* PAGE CONTENT */
#page{max-width:500px;margin:0 auto;padding:0 16px;}

/* INSIGHTS TAB */
.insight-card{background:var(--card);border-radius:var(--radius-sm);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:12px;}
.insight-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;}
.pie-wrap{display:flex;align-items:center;gap:20px;}
.pie-svg{flex-shrink:0;}
.pie-legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.pie-leg-item{display:flex;align-items:center;gap:8px;}
.pie-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pie-leg-name{font-size:12px;color:var(--text2);flex:1;}
.pie-leg-pct{font-size:12px;font-weight:700;color:var(--text);}

/* SETTINGS TAB */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.setting-left{display:flex;align-items:center;gap:12px;}
.setting-icon{font-size:22px;}
.setting-label{font-size:14px;font-weight:600;color:var(--text);}
.setting-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.toggle{width:46px;height:26px;background:var(--border);border-radius:13px;position:relative;cursor:pointer;transition:background .3s;border:none;flex-shrink:0;}
.toggle.on{background:var(--grad);}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .3s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.toggle.on::after{transform:translateX(20px);}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div style="max-width:500px;margin:0 auto;padding:0 16px;">
    <div class="header-top">
      <div class="app-name">Spendie</div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle dark mode">🌙</button>
        <button class="icon-btn" onclick="openExport()" title="Export">📤</button>
      </div>
    </div>
  </div>
</div>

<!-- PAGE -->
<div id="page"></div>

<!-- FAB -->
<button id="fab" onclick="openAddSheet()">+</button>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
  <button class="nav-btn active" onclick="switchPage('home',this)">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" onclick="switchPage('transactions',this)">
    <span class="nav-icon">📋</span>
    <span class="nav-label">Transactions</span>
  </button>
  <button class="nav-btn" onclick="switchPage('insights',this)">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Insights</span>
  </button>
  <button class="nav-btn" onclick="switchPage('settings',this)">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Settings</span>
  </button>
</div>

<!-- ADD SHEET -->
<div id="add-sheet">
  <div class="sheet-overlay" onclick="closeAddSheet()"></div>
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add Transaction</div>

    <div class="type-toggle">
      <button class="type-btn expense-active" id="type-exp" onclick="setType('expense')">💸 Expense</button>
      <button class="type-btn" id="type-inc" onclick="setType('income')">💰 Income</button>
    </div>

    <div class="field">
      <label>Amount</label>
      <div class="amount-wrap">
        <span class="currency">$</span>
        <input id="f-amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal"/>
      </div>
    </div>

    <div class="field">
      <label>Description</label>
      <input id="f-label" type="text" placeholder="What was this for?" autocomplete="off"/>
    </div>

    <div class="field">
      <label>Category</label>
      <div class="cat-picker" id="cat-picker"></div>
    </div>

    <div class="two-col">
      <div class="field">
        <label>Date</label>
        <input id="f-date" type="date"/>
      </div>
      <div class="field" style="display:flex;flex-direction:column;justify-content:flex-end;">
        <label>&nbsp;</label>
        <button class="submit-btn" onclick="addEntry()" style="margin-top:0;padding:14px;">Add ✓</button>
      </div>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div id="export-modal">
  <div class="sheet-overlay" onclick="closeExport()"></div>
  <div class="exp-sheet">
    <div class="sheet-handle"></div>
    <div class="exp-title">Export Report</div>
    <div class="exp-sub" id="exp-sub"></div>
    <button class="exp-opt" onclick="exportExcel()">
      <span class="exp-opt-icon">📊</span>
      <div>
        <span class="exp-opt-title">Excel (.xlsx)</span>
        <span class="exp-opt-sub">3 sheets: Income, Expenses & Summary. Opens in Excel, Numbers or Google Sheets.</span>
      </div>
    </button>
    <button class="exp-opt" onclick="exportCSV()">
      <span class="exp-opt-icon">📄</span>
      <div>
        <span class="exp-opt-title">CSV File</span>
        <span class="exp-opt-sub">Universal format. Import into any spreadsheet app.</span>
      </div>
    </button>
    <button class="exp-opt" onclick="exportJSON()">
      <span class="exp-opt-icon">💾</span>
      <div>
        <span class="exp-opt-title">JSON Backup</span>
        <span class="exp-opt-sub">Full data backup. Use to restore your data later.</span>
      </div>
    </button>
    <button class="exp-opt" onclick="openGoogleSheets()">
      <span class="exp-opt-icon">🟢</span>
      <div>
        <span class="exp-opt-title">Google Sheets</span>
        <span class="exp-opt-sub">Downloads CSV then opens a new Google Sheet for import.</span>
      </div>
    </button>
    <button class="exp-cancel" onclick="closeExport()">Cancel</button>
  </div>
</div>

<script>
// ── CATEGORIES ───────────────────────────────────────────────────
const CATS = {
  expense: [
    {id:'food',       label:'Food',          icon:'🍔', color:'#FF6B6B'},
    {id:'shopping',   label:'Shopping',      icon:'🛍️', color:'#A78BFA'},
    {id:'bills',      label:'Bills',         icon:'🧾', color:'#FB923C'},
    {id:'transport',  label:'Transport',     icon:'🚗', color:'#60A5FA'},
    {id:'health',     label:'Health',        icon:'💊', color:'#34D399'},
    {id:'entertain',  label:'Fun',           icon:'🎬', color:'#F472B6'},
    {id:'savings',    label:'Savings',       icon:'🏦', color:'#FACC15'},
    {id:'other',      label:'Other',         icon:'📦', color:'#94A3B8'},
  ],
  income: [

// ── DATA ─────────────────────────────────────────────────────────
let data = {income:[], expenses:[], streak:0, lastTracked:null};
let currentPage = 'home';
let formType = 'expense';
let selectedCat = 'food';
let isDark = false;

try {
  const s = localStorage.getItem('spendie-data');
  if(s) data = {...data, ...JSON.parse(s)};
} catch(e){}

try {
  isDark = localStorage.getItem('spendie-dark') === '1';
  if(isDark){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('theme-btn').textContent='☀️'; }
} catch(e){}

function save(){
  try { localStorage.setItem('spendie-data', JSON.stringify(data)); } catch(e){}
}

function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0); }
function fmtShort(n){
  if(n>=1000) return '$'+(n/1000).toFixed(1)+'k';
  return fmt(n);
}

// ── STREAK ───────────────────────────────────────────────────────
function updateStreak(){
  const today = new Date().toDateString();
  if(data.lastTracked !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(data.lastTracked === yesterday) data.streak = (data.streak||0)+1;
    else if(data.lastTracked !== today) data.streak = 1;
    data.lastTracked = today;
    save();
  }
}

// ── THEME ─────────────────────────────────────────────────────────
function toggleTheme(){
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark?'dark':'light');
  document.getElementById('theme-btn').textContent = isDark?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').content = isDark?'#0F172A':'#F8FAFC';
  try { localStorage.setItem('spendie-dark', isDark?'1':'0'); } catch(e){}
}

// ── TOTALS ────────────────────────────────────────────────────────
function totIncome(){ return data.income.reduce((s,i)=>s+i.amount,0); }
function totExpenses(){ return data.expenses.reduce((s,i)=>s+i.amount,0); }
function savings(){ return Math.max(0, totIncome()-totExpenses()); }

// ── PAGES ─────────────────────────────────────────────────────────
function switchPage(page, btn){
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}

function render(){
  const pg = document.getElementById('page');
  if(currentPage==='home') pg.innerHTML = renderHome();
  else if(currentPage==='transactions') pg.innerHTML = renderTransactions();
  else if(currentPage==='insights') pg.innerHTML = renderInsights();
  else if(currentPage==='settings') pg.innerHTML = renderSettings();
}

    const total = data.expenses.filter(e=>e.category===cat.id).reduce((s,e)=>s+e.amount,0);
    return {...cat, total};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxCat = catTotals[0]?.total||1;

  // simple pie (SVG)
  let pie = '';
  if(catTotals.length>0){
    let offset=0;
    const r=40, cx=50, cy=50, circumference=2*Math.PI*r;
    pie = `<svg class="pie-svg" width="100" height="100" viewBox="0 0 100 100">
      ${catTotals.map(cat=>{
        const pct = cat.total/te;
        const dash = pct*circumference;
        const gap = circumference-dash;
        const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color}" stroke-width="18"
          stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset*circumference}" transform="rotate(-90 50 50)" opacity=".85"/>`;
        offset += pct;
        return el;
      }).join('')}
      <circle cx="50" cy="50" r="28" fill="var(--card)"/>
      <text x="50" y="46" text-anchor="middle" font-size="9" fill="var(--text2)" font-family="Inter">Spent</text>

  <div style="margin-top:12px;">
    <div class="sec-title">Insights</div>

    ${te===0?`
      <div class="empty-state">
        <div class="empty-emoji">📊</div>
        <div class="empty-title">No data yet</div>

    `:`

      <div class="insight-card">
        <div class="insight-title">Spending by Category</div>
        <div class="pie-wrap">
          ${pie}
          <div class="pie-legend">
            ${catTotals.slice(0,5).map(cat=>`
              <div class="pie-leg-item">
                <div class="pie-leg-dot" style="background:${cat.color}"></div>
                <span class="pie-leg-name">${cat.label}</span>
                <span class="pie-leg-pct">${Math.round((cat.total/te)*100)}%</span>

          </div>

      <!-- CATEGORY BARS -->
      <div class="cat-card">
        <div class="insight-title">Top Expenses</div>
        ${catTotals.map(cat=>`
          <div class="cat-item">
            <div class="cat-dot" style="background:${cat.color}"></div>
            <span class="cat-item-name">${cat.icon} ${cat.label}</span>

      <!-- SUMMARY CARD -->
      <div class="insight-card">
        <div class="insight-title">Summary</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${[
            {label:'Total Income', val:fmt(ti), color:'#34D399'},

// ── ADD SHEET ─────────────────────────────────────────────────────
function openAddSheet(){
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-amount').value = '';
  document.getElementById('f-label').value = '';
  renderCatPicker();
  document.getElementById('add-sheet').classList.add('open');
  setTimeout(()=>document.getElementById('f-amount').focus(),300);
}
function closeAddSheet(){
  document.getElementById('add-sheet').classList.remove('open');
}

function setType(type){
  formType = type;
  selectedCat = type==='expense'?'food':'salary';
  document.getElementById('type-exp').className = 'type-btn'+(type==='expense'?' expense-active':'');
  document.getElementById('type-inc').className = 'type-btn'+(type==='income'?' income-active':'');
  renderCatPicker();
}

function renderCatPicker(){
  const cats = CATS[formType];
  document.getElementById('cat-picker').innerHTML = cats.map(cat=>`
    <button class="cat-pick-btn ${selectedCat===cat.id?'selected':''}" onclick="selectCat('${cat.id}')">
      <span class="cat-pick-icon">${cat.icon}</span>
      <span class="cat-pick-lbl">${cat.label}</span>
    </button>`).join('');
}

function selectCat(id){
  selectedCat = id;
  renderCatPicker();
}

function getCat(type, id){
  const list = CATS[type==='income'?'income':'expense'];
  return list.find(c=>c.id===id) || list[list.length-1];
}

function addEntry(){
  const label  = (document.getElementById('f-label').value||'').trim();
  const amount = parseFloat(document.getElementById('f-amount').value||'');
  const date   = document.getElementById('f-date').value || new Date().toISOString().slice(0,10);

  if(!amount||amount<=0){
    document.getElementById('f-amount').style.borderColor='#FF6B6B';
    setTimeout(()=>document.getElementById('f-amount').style.borderColor='',1000);
    return;
  }
  const finalLabel = label || getCat(formType, selectedCat).label;
  const entry = {id:Date.now(), label:finalLabel, amount, category:selectedCat, date};

  if(formType==='income') data.income.unshift(entry);
  else data.expenses.unshift(entry);

  updateStreak();
  save();
  closeAddSheet();
  render();
  showToast('✓ Transaction added!');
}

function deleteEntry(type, id){
  data[type] = data[type].filter(e=>e.id!==id);
  save();
  render();
}

function clearAllData(){
  if(!confirm('Delete ALL data? This cannot be undone.')) return;
  data = {income:[], expenses:[], streak:0, lastTracked:null};
  save();
  render();
  showToast('All data cleared');
}

// ── EXPORT ────────────────────────────────────────────────────────
function openExport(){
  document.getElementById('exp-sub').textContent =
    `${data.income.length+data.expenses.length} entries · ${new Date().toLocaleDateString()}`;
  document.getElementById('export-modal').classList.add('open');
}
function closeExport(){ document.getElementById('export-modal').classList.remove('open'); }

function exportExcel(){
  closeExport();
  const wb = XLSX.utils.book_new();
  const ti=totIncome(), te=totExpenses();
  const wsI = XLSX.utils.aoa_to_sheet([
    ['Date','Description','Category','Amount (USD)'],
    ...data.income.map(e=>[e.date,e.label,getCat('income',e.category).label,e.amount]),
    [],['TOTAL','','',ti]
  ]);
  wsI['!cols']=[{wch:12},{wch:32},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,wsI,'Income');
  const wsE = XLSX.utils.aoa_to_sheet([
    ['Date','Description','Category','Amount (USD)'],
    ...data.expenses.map(e=>[e.date,e.label,getCat('expense',e.category).label,e.amount]),
    [],['TOTAL','','',te]
  ]);
  wsE['!cols']=[{wch:12},{wch:32},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,wsE,'Expenses');
  const catBreak = CATS.expense.map(cat=>{
    const t=data.expenses.filter(e=>e.category===cat.id).reduce((s,e)=>s+e.amount,0);
    return t>0?[cat.label,t,te>0?((t/te)*100).toFixed(1)+'%':'0%']:null;
  }).filter(Boolean);
  const wsS = XLSX.utils.aoa_to_sheet([
    ['Spendie Budget Summary'],['Generated',new Date().toLocaleDateString()],[],
    ['','Amount (USD)'],['Total Income',ti],['Total Expenses',te],['Net Savings',ti-te],[],
    ['Expense Breakdown'],['Category','Amount','% of Expenses'],...catBreak
  ]);
  wsS['!cols']=[{wch:28},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,wsS,'Summary');
  XLSX.writeFile(wb,`spendie-report-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('✓ Excel downloaded!');
}

function buildCSV(){
  const rows=[['Type','Date','Description','Category','Amount (USD)'],
    ...data.income.map(e=>['Income',e.date,e.label,getCat('income',e.category).label,e.amount]),
    ...data.expenses.map(e=>['Expense',e.date,e.label,getCat('expense',e.category).label,e.amount])];
  return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
}
function dlBlob(content,name,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){ closeExport(); dlBlob(buildCSV(),`spendie-${new Date().toISOString().slice(0,10)}.csv`,'text/csv'); showToast('✓ CSV downloaded!'); }
function exportJSON(){ closeExport(); dlBlob(JSON.stringify(data,null,2),`spendie-backup-${new Date().toISOString().slice(0,10)}.json`,'application/json'); showToast('✓ Backup downloaded!'); }
function openGoogleSheets(){ closeExport(); dlBlob(buildCSV(),`spendie-${new Date().toISOString().slice(0,10)}.csv`,'text/csv'); setTimeout(()=>window.open('https://sheets.new','_blank'),700); showToast('✓ CSV saved — import in Google Sheets!'); }

function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const imported=JSON.parse(ev.target.result);
        if(imported.income&&imported.expenses){
          data={...data,...imported};save();render();
          showToast('✓ Data imported!');
        } else showToast('⚠️ Invalid backup file');
      }catch{showToast('⚠️ Could not read file');}
    };r.readAsText(file);
  };inp.click();
}

// ── TOAST ─────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  clearTimeout(toastTimer);
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  toastTimer=setTimeout(()=>t.remove(),3000);
}

// ── INIT ──────────────────────────────────────────────────────────
updateStreak();
render();
</script>
</body>
